<!doctype html>
<!-- The in-app Web Browser's start page on the computer (app/desktop.py opens it when no address
     was typed): a Google search box and news sites in the language being studied. Everything it
     shows comes from js/browser-home.js, which the phone uses too. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamkeen browser</title>
  <style id="home-style"></style>
</head>
<body>
  <script type="module">
    import { HOME_CSS, homeBody, paintSaved } from "/js/browser-home.js";
    import { startTranslating } from "/js/i18n.js";
    const lang = new URLSearchParams(location.search).get("lang") || "";
    document.getElementById("home-style").textContent = HOME_CSS;
    document.body.insertAdjacentHTML("afterbegin", homeBody(lang));
    document.querySelector("input[type=search]").focus({ preventScroll: true });
    // In the language the user speaks, like the rest of the app (js/i18n.js).
    fetch("/api/settings", { cache: "no-store" }).then((r) => r.json())
      .then((s) => startTranslating(s.ui_language, "/")).catch(() => {});

    // "Your saved sites": kept by the app (this page is served by the app's own local server, so
    // it may ask). Asked again whenever the page is shown, so a site saved a moment ago is there
    // when the user comes back to the start page.
    const takeOff = (url) => fetch("/api/browser/sites", { method: "POST", headers: { "Content-Type": "application/json" },
                                                           body: JSON.stringify({ url, on: false }) }).catch(() => {});
    async function showSaved() {
      try {
        const res = await fetch("/api/browser/sites", { cache: "no-store" });
        if (res.ok) paintSaved(document, (await res.json()).sites, takeOff);
      } catch { /* the app is closing: leave the page as it is */ }
    }
    showSaved();
    window.addEventListener("pageshow", (e) => { if (e.persisted) showSaved(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) showSaved(); });
  </script>
</body>
</html>
